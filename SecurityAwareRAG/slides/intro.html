<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#07090e;--hi:#f5f8fc;--dim:#98a2b3;--faint:#59636f;--red:#ff3355;
  --d:"Archivo",sans-serif;--m:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%;overflow:hidden}
#f{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center;
  background:radial-gradient(1000px 620px at 85% 15%, rgba(255,51,85,.11), transparent 62%),
             var(--bg);
  padding:130px 150px;display:flex;flex-direction:column;font-family:var(--d)}
.who{display:flex;align-items:center;gap:18px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--red);
  box-shadow:0 0 20px 5px rgba(255,51,85,.6)}
.name{font-size:40px;font-weight:700;color:var(--hi);letter-spacing:-.01em}
.role{font-family:var(--m);font-size:22px;color:var(--faint)}
h1{margin-top:auto;font-size:150px;font-weight:800;letter-spacing:-.045em;line-height:1;
  color:var(--hi)}
.line{margin-top:40px;font-size:46px;font-weight:600;color:var(--dim);letter-spacing:-.02em;
  max-width:1450px;line-height:1.3}
.line b{color:var(--hi);font-weight:800}
.foot{margin-top:auto;padding-top:34px;border-top:1px solid #18202b;
  font-family:var(--m);font-size:21px;color:var(--faint);letter-spacing:.04em}
</style></head><body>
<div id="f">
  <div class="who"><span class="dot"></span><span class="name">Tarkshya</span>
    <span class="role">AI Systems Engineer</span></div>
  <h1>SecurityAwareRAG</h1>
  <div class="line">Securing AI agents that read documents
    <b>written by the people they're judging.</b></div>
  <div class="foot">Razorpay AI Buildathon 2026 · AI Risk Manager</div>
</div>
<script>const f=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);
document.getElementById('f').style.transform=`translate(-50%,-50%) scale(${s})`};
addEventListener('resize',f);f();</script></body></html>
