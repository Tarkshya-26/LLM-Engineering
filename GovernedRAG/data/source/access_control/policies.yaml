# ---------------------------------------------------------------------------
# Lifecycle visibility: NOT authorization. Authorization still runs on every
# version that retrieval returns, using that version's own grants.
# ---------------------------------------------------------------------------
lifecycle_visibility:
  current: default_visible
  superseded: history_only
  archived: history_only
  deleted: never

# ---------------------------------------------------------------------------
# Historical versions (approved): history never grants more than the present.
# A superseded or archived version is returned only if the principal passes
# BOTH that version's own grants AND the current version's grants.
# ---------------------------------------------------------------------------
historical_version_authorization:
  rule: must_pass_own_and_current
  when_no_current_version: own_grants_only
  description: History never grants more than the current version. Both checks run at decision time.

# ---------------------------------------------------------------------------
# Erasure (one former employee in BATCH-04)
# ---------------------------------------------------------------------------
erasure:
  deletes_retention_classes: [personal_data]
  retains_retention_classes: [standard, financial_record, legal_hold]
  deletes_entity_types: [compensation, performance_review]
  nulls_entity_fields: [employee.date_of_birth, employee.preferred_name]
  cdc_before_image: ids_only

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------
audit:
  log_allows_for_labels: [confidential, restricted]
  log_all_denies: true
  retain_days: 365
