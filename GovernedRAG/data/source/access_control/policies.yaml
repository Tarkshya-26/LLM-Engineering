  - document_type: employee_profile
    source_system: hris
    tenant_scope: internal
    sensitivity_label: internal
    access_groups: []
    access_relation_templates: []
    access_principal_templates: []
    retention_class: personal_data
    content_origin: internal
    description: Role, team, location, hire date, recognitions. No pay, no ratings, no date of birth.
  - document_type: compensation_record
    source_system: hris
    tenant_scope: internal
    sensitivity_label: restricted
    access_groups: [GRP-hr-comp]
    access_relation_templates: [{ relation: self, subject_from: primary_employee }]
    access_principal_templates: []
    retention_class: personal_data
    content_origin: internal
    description: Pay history. HR compensation and the employee only.
  - document_type: performance_review
    source_system: hris
    tenant_scope: internal
    sensitivity_label: confidential
    access_groups: [GRP-hr]
    access_relation_templates: [{ relation: self, subject_from: primary_employee }, { relation: manager_of, subject_from: primary_employee }]
    access_principal_templates: []
